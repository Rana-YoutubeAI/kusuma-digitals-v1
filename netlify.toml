# Kusuma Digital Solutions — Netlify Configuration
# This file controls redirects, headers, and build settings.

[build]
  publish = "."

# ─── REDIRECTS ──────────────────────────────────────────────────────────────

# Force HTTP → HTTPS (Netlify does this by default but explicit is better)
[[redirects]]
  from = "http://kusumadigitalsolutions.com/*"
  to   = "https://www.kusumadigitalsolutions.com/:splat"
  status = 301
  force  = true

# Force non-www → www (canonical domain)
[[redirects]]
  from = "https://kusumadigitalsolutions.com/*"
  to   = "https://www.kusumadigitalsolutions.com/:splat"
  status = 301
  force  = true

# Block internal docs from being served publicly
[[redirects]]
  from   = "/docs/*"
  to     = "/404.html"
  status = 404
  force  = true

# Custom 404 page — MUST be last redirect
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

# ─── SECURITY HEADERS (applied to every page) ────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking — no one can embed your site in an iframe
    X-Frame-Options = "DENY"

    # Prevent MIME type sniffing attacks
    X-Content-Type-Options = "nosniff"

    # Control referrer info when clicking outbound links
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Disable features you don't use (camera, mic, GPS)
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

    # Force HTTPS for 1 year across all subdomains
    # After confirming the site is stable on HTTPS, submit to: https://hstspreload.org
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Content Security Policy — controls which resources the browser is allowed to load.
    # 'unsafe-inline' on script-src: required for the inline copyright-year <script> on each page.
    # 'unsafe-inline' on style-src: required for the FOUC <style>body{visibility:hidden}</style>.
    # When Calendly is added: add https://calendly.com to frame-src and https://assets.calendly.com to script-src.
    # When Lucide is self-hosted: remove https://unpkg.com from script-src.
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'unsafe-inline' https://unpkg.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; frame-src https://calendly.com; form-action 'self'; base-uri 'self'; object-src 'none';"

# ─── CACHE HEADERS ───────────────────────────────────────────────────────────
# Static assets cached for 1 year — huge performance win
# If you change a file, change its filename or add ?v=2 to bust the cache

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML pages — short cache, always fresh
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"